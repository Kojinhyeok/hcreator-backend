<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>GIF 템플릿 관리 - H CREATOR</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.snow.min.css" rel="stylesheet">
	<style>
		#quillEditor .ql-editor img {
		  display: inline-block;
		  max-width: 100%;
		}
		#quillEditor .ql-editor img,
		#quillEditor .ql-editor video { cursor: pointer; }
		#quillEditor .ql-editor .media-selected {
		  outline: 3px solid #534AB7;
		  outline-offset: -3px;
		}
		#mediaToolbar {
		  display: none;
		  position: fixed;
		  z-index: 3000;
		  gap: 4px;
		  padding: 4px;
		  border-radius: 6px;
		  background: #2b2d42;
		  box-shadow: 0 2px 8px rgba(0,0,0,.35);
		}
		#mediaToolbar button {
		  padding: 3px 9px;
		  border: 0;
		  border-radius: 4px;
		  background: #4a4e69;
		  color: #fff;
		  font-size: 12px;
		  font-weight: 600;
		}
		#mediaToolbar button.active { background: #534AB7; }
		#mediaToolbar button.danger { background: #dc3545; }
		#quillEditor .ql-editor video.ql-gif-video {
		  display: block;
		  width: 100%;
		  max-width: 100%;
		  height: auto;
		  background: #f3f2fc;
		}
	</style>

</head>

<body data-page="gif-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>GIF 템플릿 관리</strong></h1>
					<button class="btn btn-primary" onclick="openAddModal()">
						<i class="align-middle" data-feather="plus"></i> 템플릿 등록
					</button>
				</div>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="gifTable">
							<thead>
							<tr>
								<th style="width:80px;">미리보기</th>
								<th>제목</th>
								<th style="width:100px;">순서</th>
								<th style="width:130px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
				<nav class="mt-3">
					<ul class="pagination justify-content-center" id="gifPagination"></ul>
				</nav>
			</div>
		</main>
	</div>
</div>

<div class="modal fade" id="gifModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalTitle">템플릿 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="gifForm">
					<input type="hidden" id="itemId">

					<div class="mb-3">
						<label class="form-label">템플릿 이미지</label>
						<input type="file" class="form-control" id="gifFile" accept="image/*" onchange="previewImage(this)">
						<div id="thumbnailPreview" class="mt-2 d-none">
							<img id="previewImg" src="" style="max-width:200px; height:auto;" class="img-thumbnail border">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">템플릿 이름 <span class="text-danger">*</span></label>
						<textarea class="form-control" id="title" rows="3" required placeholder="한 줄에 하나씩 입력&#10;예: ✔️주름&#10;✔️탄력(탄성복원력)&#10;✔️피부결"></textarea>
					</div>

					<div class="mb-3">
						<label class="form-label">상세 내용</label>
						<div class="form-text mb-1">이미지 버튼에서 여러 파일을 한 번에 선택하면 파일명 숫자 순서대로 이어서 들어갑니다. GIF는 자동으로 MP4로 변환돼요. 빈 줄에 커서를 두고 삽입해 주세요.</div>
						<div id="editorUploadStatus" class="small text-primary mb-1"></div>
						<div id="quillEditor" style="height: 300px; background:#fff;"></div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSave">저장하기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.min.js"></script>
<script>
	// MP4로 저장된 항목은 미리보기에 포스터(jpg)를 사용
	// 목록 썸네일: MP4는 포스터 이미지를 쓰되, 포스터가 없으면 영상의 첫 장면으로 대신 보여준다
	function mediaThumb(path) {
		const box = 'width:50px;height:50px;';
		if (!path) return `<div class="bg-light border rounded" style="${box}"></div>`;
		const p = String(path).replace(/"/g, '&quot;');
		const style = box + 'object-fit:cover;';
		if (/\.mp4$/i.test(path)) {
			const poster = p.replace(/\.mp4$/i, '_poster.jpg');
			return `<img src="${poster}" data-video="${p}" style="${style}" class="rounded border" onerror="thumbFallback(this)">`;
		}
		return `<img src="${p}" style="${style}" class="rounded border">`;
	}

	function thumbFallback(img) {
		img.onerror = null;
		const v = document.createElement('video');
		v.src = img.dataset.video + '#t=0.1';
		v.muted = true;
		v.playsInline = true;
		v.preload = 'metadata';
		v.setAttribute('style', img.getAttribute('style'));
		v.className = img.className;
		img.replaceWith(v);
	}

	function thumbOf(path) {
		return path && path.endsWith('.mp4') ? path.replace(/\.mp4$/, '_poster.jpg') : path;
	}

	let gifList = [];
	let gifCurrentPage = 1;
	const PAGE_SIZE = 15;
	let quill;

	// 에디터용 영상 블록: GIF를 변환한 MP4를 <video>로 저장 (공개 페이지에서 화면에 보일 때만 재생)
	const BlockEmbed = Quill.import('blots/block/embed');
	class GifVideoBlot extends BlockEmbed {
		static create(value) {
			const node = super.create();
			node.setAttribute('data-src', value.src);
			node.setAttribute('poster', value.poster);
			node.setAttribute('muted', '');
			node.setAttribute('loop', '');
			node.setAttribute('playsinline', '');
			node.setAttribute('preload', 'none');
			node.classList.add('lazy-video');
			return node;
		}
		static value(node) {
			return { src: node.getAttribute('data-src'), poster: node.getAttribute('poster') };
		}
	}
	GifVideoBlot.blotName = 'gifVideo';
	GifVideoBlot.tagName = 'video';
	GifVideoBlot.className = 'ql-gif-video';
	Quill.register(GifVideoBlot);

	document.addEventListener("DOMContentLoaded", function () {
		quill = new Quill('#quillEditor', {
			theme: 'snow',
			modules: {
				toolbar: {
				container: [
					[{ header: [1, 2, 3, false] }],
					['bold', 'italic', 'underline'],
					[{ align: [] }],
					['image'],
					['clean']
				],
				handlers: { image: quillImageHandler }
				}
			}
		});

		initEditorMediaDelete();
		loadItems();
		document.getElementById("btnSave").addEventListener("click", saveItem);
	});

	// 에디터 안 GIF/이미지: 클릭해서 선택 → 크기(25/50/75/100%) 조절 또는 삭제
	let selectedMedia = null;
	let mediaToolbar = null;
	const MEDIA_SIZES = ['25%', '50%', '75%', '100%'];

	function clearMediaSelection() {
		if (selectedMedia) selectedMedia.classList.remove('media-selected');
		selectedMedia = null;
		if (mediaToolbar) mediaToolbar.style.display = 'none';
	}

	function currentMediaSize(node) {
		return node.style.width || '100%';
	}

	function highlightSizeButtons() {
		if (!selectedMedia) return;
		const cur = currentMediaSize(selectedMedia);
		mediaToolbar.querySelectorAll('button[data-size]').forEach((b) => {
			b.classList.toggle('active', b.dataset.size === cur);
		});
	}

	function positionToolbar() {
		if (!selectedMedia) return;
		const r = selectedMedia.getBoundingClientRect();
		mediaToolbar.style.display = 'flex';
		mediaToolbar.style.top = Math.max(r.top + 8, 8) + 'px';
		mediaToolbar.style.left = Math.max(Math.min(r.left + 8, window.innerWidth - 280), 8) + 'px';
	}

	function selectMedia(node) {
		clearMediaSelection();
		selectedMedia = node;
		node.classList.add('media-selected');
		highlightSizeButtons();
		positionToolbar();
	}

	function resizeSelectedMedia(size) {
		const node = selectedMedia;
		if (!node) return;
		if (size === '100%') {
			node.style.removeProperty('width');
			node.style.removeProperty('margin-left');
			node.style.removeProperty('margin-right');
			if (!node.getAttribute('style')) node.removeAttribute('style');
		} else {
			node.style.width = size;
			node.style.marginLeft = 'auto';   // 공개 페이지에서 가운데 정렬
			node.style.marginRight = 'auto';
		}
		quill.update('user');
		highlightSizeButtons();
		positionToolbar();
	}

	function deleteSelectedMedia() {
		const node = selectedMedia;
		if (!node) return;
		clearMediaSelection();
		const blot = Quill.find(node);
		if (blot && typeof blot.length === 'function' && blot.scroll) {
			quill.deleteText(quill.getIndex(blot), blot.length(), 'user');
		} else {
			// 에디터가 인식하지 못하는 옛 데이터: 화면에서 직접 제거하고 에디터에 반영
			node.remove();
			quill.update('user');
		}
	}

	function initEditorMediaDelete() {
		mediaToolbar = document.createElement('div');
		mediaToolbar.id = 'mediaToolbar';
		mediaToolbar.innerHTML = MEDIA_SIZES.map((s) => `<button type="button" data-size="${s}">${s}</button>`).join('')
			+ '<button type="button" class="danger" data-act="delete">× 삭제</button>';
		mediaToolbar.addEventListener('mousedown', (e) => e.preventDefault());
		mediaToolbar.addEventListener('click', (e) => {
			const btn = e.target.closest('button');
			if (!btn) return;
			if (btn.dataset.size) resizeSelectedMedia(btn.dataset.size);
			else if (btn.dataset.act === 'delete') deleteSelectedMedia();
		});
		document.body.appendChild(mediaToolbar);

		quill.root.addEventListener('click', (e) => {
			const t = e.target;
			if (t && (t.tagName === 'IMG' || t.tagName === 'VIDEO')) {
				e.preventDefault();
				selectMedia(t);
			} else {
				clearMediaSelection();
			}
		});
		quill.root.addEventListener('keydown', (e) => {
			if (selectedMedia && (e.key === 'Delete' || e.key === 'Backspace')) {
				e.preventDefault();
				deleteSelectedMedia();
			}
		});
		quill.root.addEventListener('scroll', clearMediaSelection);
		document.getElementById('gifModal').addEventListener('hidden.bs.modal', clearMediaSelection);
	}

	// 에디터 이미지 버튼: 여러 파일 선택 가능, 파일명 숫자 순서대로 삽입, GIF는 서버에서 MP4로 변환
	async function quillImageHandler() {
		const input = document.createElement('input');
		input.type = 'file';
		input.accept = 'image/*';
		input.multiple = true;
		input.onchange = async () => {
			const files = Array.from(input.files)
				.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
			if (!files.length) return;

			const status = document.getElementById('editorUploadStatus');
			let index = quill.getSelection(true).index;

			for (let i = 0; i < files.length; i++) {
				status.textContent = `업로드/변환 중... (${i + 1}/${files.length}) ${files[i].name}`;
				try {
					const formData = new FormData();
					formData.append('file', files[i]);
					const res = await fetch('/api/admin/gif/upload', { method: 'POST', body: formData });
					if (!res.ok) throw new Error('upload failed');
					const result = await res.json();

					if (result.publicUrl.endsWith('.mp4')) {
						quill.insertEmbed(index, 'gifVideo', {
							src: result.publicUrl,
							poster: result.publicUrl.replace(/\.mp4$/, '_poster.jpg')
						}, 'user');
					} else {
						quill.insertEmbed(index, 'image', result.publicUrl, 'user');
					}
					index += 1;
					quill.setSelection(index, 0, 'silent');
				} catch (err) {
					alert(`'${files[i].name}' 업로드에 실패했습니다.`);
				}
			}
			status.textContent = '';
		};
		input.click();
	}

	function loadItems() {
		fetch("/api/admin/gif")
			.then(res => res.json())
			.then(list => {
				gifList = list;
				gifCurrentPage = 1;
				renderGifPage();
			});
	}

	function renderGifPage() {
		const totalPages = Math.max(1, Math.ceil(gifList.length / PAGE_SIZE));
		if (gifCurrentPage > totalPages) gifCurrentPage = totalPages;

		const start = (gifCurrentPage - 1) * PAGE_SIZE;
		const pageItems = gifList.slice(start, start + PAGE_SIZE);

		const tbody = document.querySelector("#gifTable tbody");
		tbody.innerHTML = pageItems.length === 0
			? '<tr><td colspan="4" class="text-center py-4">등록된 템플릿이 없습니다.</td></tr>'
			: pageItems.map((item) => {
				const index = gifList.indexOf(item);
				return `
					<tr>
						<td>
							${mediaThumb(item.imagePath)}
						</td>
						<td class="align-middle" style="white-space: pre-line;">${item.title}</td>
						<td class="align-middle">${item.sortOrder ?? '-'}</td>
						<td class="align-middle">
							<button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${index})">수정</button>
							<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">삭제</button>
						</td>
					</tr>
				`;
			}).join("");

		renderPaginationUI("gifPagination", totalPages, gifCurrentPage, (p) => { gifCurrentPage = p; renderGifPage(); });
	}

	async function saveItem() {
		const btn = document.getElementById("btnSave");
		const id = document.getElementById("itemId").value;
		const fileInput = document.getElementById("gifFile");
		const file = fileInput.files[0];
		const title = document.getElementById("title").value;
		clearMediaSelection();
		const detailContent = quill.root.innerHTML.replace(/\s*media-selected/g, '').replace(/ class=""/g, '');

		if (!title) { alert("템플릿 이름을 입력해주세요."); return; }
		if (!id && !file) { alert("이미지를 선택해주세요."); return; }

		try {
			btn.disabled = true;
			btn.innerText = "처리 중...";

			let imagePath = null;

			if (file) {
				const formData = new FormData();
				formData.append('file', file);
				const uploadResult = await fetch("/api/admin/gif/upload", {
					method: "POST",
					body: formData
				}).then(res => res.json());
				imagePath = uploadResult.publicUrl;
			}

			const url = id ? `/api/admin/gif/${id}` : `/api/admin/gif`;
			const method = id ? "PUT" : "POST";

			const response = await fetch(url, {
				method: method,
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ title, imagePath, detailContent })
			});
			if (!response.ok) throw new Error("저장 실패");

			alert("처리되었습니다.");
			bootstrap.Modal.getInstance(document.getElementById('gifModal')).hide();
			loadItems();
		} catch (err) {
			alert(err.message);
		} finally {
			btn.disabled = false;
			btn.innerText = "저장하기";
		}
	}

	function previewImage(input) {
		const previewImg = document.getElementById("previewImg");
		if (input.files && input.files[0]) {
			const reader = new FileReader();
			reader.onload = e => {
				previewImg.src = e.target.result;
				document.getElementById("thumbnailPreview").classList.remove("d-none");
			}
			reader.readAsDataURL(input.files[0]);
		}
	}

	function openAddModal() {
		document.getElementById("gifForm").reset();
		document.getElementById("itemId").value = "";
		document.getElementById("thumbnailPreview").classList.add("d-none");
		document.getElementById("modalTitle").innerText = "템플릿 등록";
		quill.setContents([]);
		bootstrap.Modal.getOrCreateInstance(document.getElementById('gifModal')).show();
	}

	function openEditModal(index) {
		const item = gifList[index];
		document.getElementById("itemId").value = item.id;
		document.getElementById("title").value = item.title;

		const previewImg = document.getElementById("previewImg");
		if (item.imagePath) {
			previewImg.src = thumbOf(item.imagePath);
			document.getElementById("thumbnailPreview").classList.remove("d-none");
		} else {
			document.getElementById("thumbnailPreview").classList.add("d-none");
		}

		quill.root.innerHTML = item.detailContent || '';

		document.getElementById("modalTitle").innerText = "템플릿 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('gifModal')).show();
	}

	function deleteItem(id) {
		if (confirm("이 템플릿을 삭제하시겠습니까?")) {
			fetch(`/api/admin/gif/${id}`, { method: "DELETE" })
				.then(res => {
					if (res.ok) { alert("삭제되었습니다."); loadItems(); }
					else { alert("삭제에 실패했습니다. (오류 " + res.status + ") 잠시 후 다시 시도해 주세요."); }
				})
				.catch(() => alert("삭제 요청 중 오류가 발생했습니다."));
		}
	}

	function renderPaginationUI(containerId, totalPages, currentPage, onPageClick) {
		const container = document.getElementById(containerId);
		if (!container) return;
		if (totalPages <= 1) { container.innerHTML = ""; return; }

		let html = "";
		for (let p = 1; p <= totalPages; p++) {
			html += `<li class="page-item ${p === currentPage ? 'active' : ''}">
				<a href="#" class="page-link" data-page="${p}">${p}</a>
			</li>`;
		}
		container.innerHTML = html;

		container.querySelectorAll("a.page-link").forEach((a) => {
			a.addEventListener("click", (e) => {
				e.preventDefault();
				onPageClick(parseInt(a.dataset.page, 10));
			});
		});
	}
</script>
</body>
</html>
