<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>관리자 로그인 - H CREATOR</title>
	<link href="css/app.css" rel="stylesheet">
	<link href="css/custom.css" rel="stylesheet">
</head>
<body>
<main class="d-flex w-100">
	<div class="container d-flex flex-column">
		<div class="row vh-100">
			<div class="col-sm-10 col-md-8 col-lg-6 col-xl-4 mx-auto d-table h-100">
				<div class="d-table-cell align-middle">
					<div class="text-center mt-4">
						<h1 class="h2">H CREATOR 관리자</h1>
						<p class="lead">관리자 계정으로 로그인하세요.</p>
					</div>

					<div class="card">
						<div class="card-body">
							<div class="m-sm-4">
								<form id="loginForm">
									<div class="mb-3">
										<label class="form-label">아이디</label>
										<input class="form-control" type="text" id="username" required>
									</div>
									<div class="mb-3">
										<label class="form-label">비밀번호</label>
										<input class="form-control" type="password" id="password" required>
									</div>
									<div id="errorMsg" class="text-danger small mb-3" style="display:none;"></div>
									<div class="d-grid">
										<button type="submit" class="btn btn-lg btn-primary" id="btnLogin">로그인</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</main>

<script>
	document.getElementById("loginForm").addEventListener("submit", function (e) {
		e.preventDefault();
		const username = document.getElementById("username").value.trim();
		const password = document.getElementById("password").value;
		const errorMsg = document.getElementById("errorMsg");
		errorMsg.style.display = "none";

		if (!username || !password) return;

		fetch("/api/auth/login", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ username, password })
		})
			.then(async res => {
				if (!res.ok) throw new Error("아이디 또는 비밀번호가 일치하지 않습니다.");
				return res.json();
			})
			.then(data => {
				if (data.role !== "ADMIN") {
					throw new Error("관리자 권한이 없는 계정입니다.");
				}
				window.location.href = "index.html";
			})
			.catch(err => {
				errorMsg.textContent = err.message;
				errorMsg.style.display = "block";
			});
	});
</script>
</body>
</html>
