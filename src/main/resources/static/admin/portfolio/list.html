<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>포트폴리오 관리 - H CREATOR</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
</head>

<body data-page="portfolio-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<h1 class="h3 mb-3"><strong>포트폴리오 관리</strong></h1>

				<ul class="nav nav-tabs mb-3" id="mainTabs">
					<li class="nav-item"><a class="nav-link active" href="#" data-main="items">이미지 항목</a></li>
					<li class="nav-item"><a class="nav-link" href="#" data-main="videos">영상</a></li>
				</ul>

				<!-- 이미지 항목 -->
				<div id="panel-items">
					<div class="d-flex gap-2 mb-3 align-items-center">
						<label class="form-label mb-0">카테고리</label>
						<select class="form-select" id="itemCategoryFilter" style="width:220px;">
							<option value="ai-image">AI 이미지 제작</option>
							<option value="card-news">카드뉴스</option>
							<option value="detail-page">상세페이지</option>
						</select>
						<button class="btn btn-primary ms-auto" onclick="openAddItemModal()">
							<i class="align-middle" data-feather="plus"></i> 항목 등록
						</button>
					</div>

					<div class="card">
						<div class="table-responsive">
							<table class="table table-hover my-0" id="itemTable">
								<thead>
								<tr>
									<th style="width:80px;">미리보기</th>
									<th style="width:120px;">유형</th>
									<th>이름</th>
									<th style="width:130px;">관리</th>
								</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
					</div>
					<nav class="mt-3">
						<ul class="pagination justify-content-center" id="itemPagination"></ul>
					</nav>
				</div>

				<!-- 영상 -->
				<div id="panel-videos" class="d-none">
					<div class="d-flex gap-2 mb-3 align-items-center flex-wrap">
						<label class="form-label mb-0">대분류</label>
						<select class="form-select" id="videoCategoryFilter" style="width:200px;"></select>
						<label class="form-label mb-0">세부 구분</label>
						<select class="form-select" id="videoSubLabelFilter" style="width:200px;"></select>
						<button class="btn btn-primary ms-auto" onclick="openAddVideoModal()">
							<i class="align-middle" data-feather="plus"></i> 영상 등록
						</button>
					</div>

					<div class="card">
						<div class="table-responsive">
							<table class="table table-hover my-0" id="videoTable">
								<thead>
								<tr>
									<th style="width:100px;">썸네일</th>
									<th>제목</th>
									<th style="width:130px;">관리</th>
								</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
					</div>
					<nav class="mt-3">
						<ul class="pagination justify-content-center" id="videoPagination"></ul>
					</nav>
				</div>

			</div>
		</main>
	</div>
</div>

<!-- 이미지 항목 모달 -->
<div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="itemModalTitle">항목 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="itemForm">
					<input type="hidden" id="itemId">

					<div class="mb-3">
						<label class="form-label">이미지</label>
						<input type="file" class="form-control" id="itemFile" accept="image/*" onchange="previewImage(this, 'itemPreview', 'itemPreviewImg')">
						<div id="itemPreview" class="mt-2 d-none">
							<img id="itemPreviewImg" src="" style="max-width:150px; height:auto;" class="img-thumbnail border">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">카테고리 <span class="text-danger">*</span></label>
						<select class="form-select" id="itemCategory" required onchange="toggleCardNewsLayout()">
							<option value="ai-image">AI 이미지 제작</option>
							<option value="card-news">카드뉴스</option>
							<option value="detail-page">상세페이지</option>
						</select>
					</div>

					<div class="mb-3" id="cardNewsLayoutGroup" style="display:none;">
						<label class="form-label">카드뉴스 형태 <span class="text-danger">*</span></label>
						<select class="form-select" id="cardNewsLayout">
							<option value="basic">기본형 (직사각형)</option>
							<option value="square">정사각형</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">이름 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="itemName" required>
					</div>

					<div class="mb-3">
						<label class="form-label">연결 링크</label>
						<input type="text" class="form-control" id="itemLink" placeholder="없으면 비워두세요">
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSaveItem">저장하기</button>
			</div>
		</div>
	</div>
</div>

<!-- 영상 모달 -->
<div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="videoModalTitle">영상 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="videoForm">
					<input type="hidden" id="videoId">

					<div class="mb-3">
						<label class="form-label">썸네일 이미지</label>
						<input type="file" class="form-control" id="videoFile" accept="image/*" onchange="previewImage(this, 'videoPreview', 'videoPreviewImg')">
						<div id="videoPreview" class="mt-2 d-none">
							<img id="videoPreviewImg" src="" style="max-width:150px; height:auto;" class="img-thumbnail border">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">대분류 <span class="text-danger">*</span></label>
						<select class="form-select" id="videoCategory" required onchange="updateVideoSubLabelOptions('videoSubLabel')"></select>
					</div>

					<div class="mb-3">
						<label class="form-label">세부 구분 <span class="text-danger">*</span></label>
						<select class="form-select" id="videoSubLabel" required></select>
					</div>

					<div class="mb-3">
						<label class="form-label">제목 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="videoTitle" required>
					</div>

					<div class="mb-3">
						<label class="form-label">영상 링크 (유튜브 등)</label>
						<input type="text" class="form-control" id="videoLink" placeholder="https://...">
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSaveVideo">저장하기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	let itemList = [];
	let videoList = [];
	let itemCurrentPage = 1;
	let videoCurrentPage = 1;
	const PAGE_SIZE = 15;

	const categoryLabel = { 'ai-image': 'AI 이미지', 'card-news': '카드뉴스', 'detail-page': '상세페이지' };

	const videoCategoryLabel = {
		'product-promo': '1. 제품 홍보 영상',
		'ai-production': '2. AI 제작',
		'brand': '3. 브랜드 영상',
		'viral': '4. 바이럴 콘텐츠',
		'review': '5. 제품 리뷰'
	};

	const videoSubLabelMap = {
		'product-promo': ['숏폼형', '가로형'],
		'ai-production': ['AI 드라마', '애니메이션', '표시광고법'],
		'brand': ['숏폼형', '가로형'],
		'viral': ['숏폼형'],
		'review': ['가로형']
	};

	function formatOf(subLabel) {
		return subLabel === '가로형' ? 'horizontal' : 'vertical';
	}

	document.addEventListener("DOMContentLoaded", function () {
		// 메인 탭(이미지 항목 / 영상) 전환
		document.querySelectorAll("#mainTabs .nav-link").forEach(tab => {
			tab.addEventListener("click", (e) => {
				e.preventDefault();
				document.querySelectorAll("#mainTabs .nav-link").forEach(t => t.classList.remove("active"));
				tab.classList.add("active");
				const target = tab.dataset.main;
				document.getElementById("panel-items").classList.toggle("d-none", target !== "items");
				document.getElementById("panel-videos").classList.toggle("d-none", target !== "videos");
				if (target === "videos") loadVideos();
			});
		});

		document.getElementById("itemCategoryFilter").addEventListener("change", loadItems);
		loadItems();

		// 영상 카테고리 셀렉트 채우기
		const videoCategoryFilter = document.getElementById("videoCategoryFilter");
		Object.entries(videoCategoryLabel).forEach(([value, label]) => {
			videoCategoryFilter.insertAdjacentHTML("beforeend", `<option value="${value}">${label}</option>`);
		});
		videoCategoryFilter.addEventListener("change", () => {
			updateVideoSubLabelOptions("videoSubLabelFilter", videoCategoryFilter.value);
			loadVideos();
		});
		updateVideoSubLabelOptions("videoSubLabelFilter", videoCategoryFilter.value);
		document.getElementById("videoSubLabelFilter").addEventListener("change", loadVideos);

		document.getElementById("btnSaveItem").addEventListener("click", saveItem);
		document.getElementById("btnSaveVideo").addEventListener("click", saveVideo);

		// 등록 모달 안 영상 카테고리 셀렉트도 채우기
		const videoCategorySelect = document.getElementById("videoCategory");
		Object.entries(videoCategoryLabel).forEach(([value, label]) => {
			videoCategorySelect.insertAdjacentHTML("beforeend", `<option value="${value}">${label}</option>`);
		});
	});

	function updateVideoSubLabelOptions(selectId, categoryValue) {
		const category = categoryValue ?? document.getElementById(selectId === "videoSubLabel" ? "videoCategory" : "videoCategoryFilter").value;
		const select = document.getElementById(selectId);
		const options = videoSubLabelMap[category] || [];
		select.innerHTML = options.map(label => `<option value="${label}">${label}</option>`).join("");
	}

	function toggleCardNewsLayout() {
		const isCardNews = document.getElementById("itemCategory").value === "card-news";
		document.getElementById("cardNewsLayoutGroup").style.display = isCardNews ? "block" : "none";
	}

	// ===== 이미지 항목 =====

	function loadItems() {
		const category = document.getElementById("itemCategoryFilter").value;
		fetch(`/api/admin/portfolio/items?category=${category}`)
			.then(res => res.json())
			.then(list => {
				itemList = list;
				itemCurrentPage = 1;
				renderItemPage();
			});
	}

	function renderItemPage() {
		const totalPages = Math.max(1, Math.ceil(itemList.length / PAGE_SIZE));
		if (itemCurrentPage > totalPages) itemCurrentPage = totalPages;

		const start = (itemCurrentPage - 1) * PAGE_SIZE;
		const pageItems = itemList.slice(start, start + PAGE_SIZE);

		const tbody = document.querySelector("#itemTable tbody");
		tbody.innerHTML = pageItems.length === 0
			? '<tr><td colspan="4" class="text-center py-4">등록된 항목이 없습니다.</td></tr>'
			: pageItems.map((item) => {
				const index = itemList.indexOf(item);
				return `
					<tr>
						<td>${item.imagePath ? `<img src="${item.imagePath}" style="width:50px;height:60px;object-fit:cover;" class="rounded border">` : '<div class="bg-light border rounded" style="width:50px;height:60px;"></div>'}</td>
						<td class="align-middle">${categoryLabel[item.category] ?? item.category}${item.cardNewsLayout ? ` <span class="badge bg-secondary">${item.cardNewsLayout === 'square' ? '정사각형' : '기본형'}</span>` : ''}</td>
						<td class="align-middle">${item.name}</td>
						<td class="align-middle">
							<button class="btn btn-sm btn-outline-primary" onclick="openEditItemModal(${index})">수정</button>
							<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">삭제</button>
						</td>
					</tr>
				`;
			}).join("");

		renderPaginationUI("itemPagination", totalPages, itemCurrentPage, (p) => { itemCurrentPage = p; renderItemPage(); });
	}

	async function saveItem() {
		const btn = document.getElementById("btnSaveItem");
		const id = document.getElementById("itemId").value;
		const file = document.getElementById("itemFile").files[0];
		const name = document.getElementById("itemName").value;
		const category = document.getElementById("itemCategory").value;
		const cardNewsLayout = category === "card-news" ? document.getElementById("cardNewsLayout").value : null;
		const linkUrl = document.getElementById("itemLink").value || null;

		if (!name) { alert("이름을 입력해주세요."); return; }
		if (!id && !file) { alert("이미지를 선택해주세요."); return; }

		try {
			btn.disabled = true; btn.innerText = "처리 중...";
			let imagePath = null;

			if (file) {
				const presign = await fetch("/api/admin/portfolio/upload-url", {
					method: "POST", headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ fileName: file.name })
				}).then(res => res.json());
				await fetch(presign.uploadUrl, { method: "PUT", body: file, headers: { "Content-Type": file.type } });
				imagePath = presign.publicUrl;
			}

			const url = id ? `/api/admin/portfolio/items/${id}` : `/api/admin/portfolio/items`;
			const method = id ? "PUT" : "POST";
			const res = await fetch(url, {
				method, headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ category, cardNewsLayout, name, imagePath, linkUrl })
			});
			if (!res.ok) throw new Error("저장 실패");

			alert("처리되었습니다.");
			bootstrap.Modal.getInstance(document.getElementById('itemModal')).hide();
			document.getElementById("itemCategoryFilter").value = category;
			loadItems();
		} catch (err) {
			alert(err.message);
		} finally {
			btn.disabled = false; btn.innerText = "저장하기";
		}
	}

	function openAddItemModal() {
		document.getElementById("itemForm").reset();
		document.getElementById("itemId").value = "";
		document.getElementById("itemCategory").value = document.getElementById("itemCategoryFilter").value;
		toggleCardNewsLayout();
		document.getElementById("itemPreview").classList.add("d-none");
		document.getElementById("itemModalTitle").innerText = "항목 등록";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('itemModal')).show();
	}

	function openEditItemModal(index) {
		const item = itemList[index];
		document.getElementById("itemId").value = item.id;
		document.getElementById("itemCategory").value = item.category;
		toggleCardNewsLayout();
		if (item.cardNewsLayout) document.getElementById("cardNewsLayout").value = item.cardNewsLayout;
		document.getElementById("itemName").value = item.name;
		document.getElementById("itemLink").value = item.linkUrl || "";

		const preview = document.getElementById("itemPreview");
		const previewImg = document.getElementById("itemPreviewImg");
		if (item.imagePath) { previewImg.src = item.imagePath; preview.classList.remove("d-none"); }
		else { preview.classList.add("d-none"); }

		document.getElementById("itemModalTitle").innerText = "항목 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('itemModal')).show();
	}

	function deleteItem(id) {
		if (confirm("이 항목을 삭제하시겠습니까?")) {
			fetch(`/api/admin/portfolio/items/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) { alert("삭제되었습니다."); loadItems(); } });
		}
	}

	// ===== 영상 =====

	function loadVideos() {
		const category = document.getElementById("videoCategoryFilter").value;
		const subLabel = document.getElementById("videoSubLabelFilter").value;
		if (!category || !subLabel) return;

		fetch(`/api/admin/portfolio/videos?category=${encodeURIComponent(category)}&subLabel=${encodeURIComponent(subLabel)}`)
			.then(res => res.json())
			.then(list => {
				videoList = list;
				videoCurrentPage = 1;
				renderVideoPage();
			});
	}

	function renderVideoPage() {
		const totalPages = Math.max(1, Math.ceil(videoList.length / PAGE_SIZE));
		if (videoCurrentPage > totalPages) videoCurrentPage = totalPages;

		const start = (videoCurrentPage - 1) * PAGE_SIZE;
		const pageItems = videoList.slice(start, start + PAGE_SIZE);

		const tbody = document.querySelector("#videoTable tbody");
		tbody.innerHTML = pageItems.length === 0
			? '<tr><td colspan="3" class="text-center py-4">등록된 영상이 없습니다.</td></tr>'
			: pageItems.map((item) => {
				const index = videoList.indexOf(item);
				return `
					<tr>
						<td>${item.thumbnailPath ? `<img src="${item.thumbnailPath}" style="width:70px;height:50px;object-fit:cover;" class="rounded border">` : '<div class="bg-light border rounded" style="width:70px;height:50px;"></div>'}</td>
						<td class="align-middle">${item.title}</td>
						<td class="align-middle">
							<button class="btn btn-sm btn-outline-primary" onclick="openEditVideoModal(${index})">수정</button>
							<button class="btn btn-sm btn-outline-danger" onclick="deleteVideo(${item.id})">삭제</button>
						</td>
					</tr>
				`;
			}).join("");

		renderPaginationUI("videoPagination", totalPages, videoCurrentPage, (p) => { videoCurrentPage = p; renderVideoPage(); });
	}

	async function saveVideo() {
		const btn = document.getElementById("btnSaveVideo");
		const id = document.getElementById("videoId").value;
		const file = document.getElementById("videoFile").files[0];
		const title = document.getElementById("videoTitle").value;
		const category = document.getElementById("videoCategory").value;
		const subLabel = document.getElementById("videoSubLabel").value;
		const format = formatOf(subLabel);
		const linkUrl = document.getElementById("videoLink").value || null;

		if (!title) { alert("제목을 입력해주세요."); return; }
		if (!id && !file) { alert("썸네일을 선택해주세요."); return; }

		try {
			btn.disabled = true; btn.innerText = "처리 중...";
			let thumbnailPath = null;

			if (file) {
				const presign = await fetch("/api/admin/portfolio/upload-url", {
					method: "POST", headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ fileName: file.name })
				}).then(res => res.json());
				await fetch(presign.uploadUrl, { method: "PUT", body: file, headers: { "Content-Type": file.type } });
				thumbnailPath = presign.publicUrl;
			}

			const url = id ? `/api/admin/portfolio/videos/${id}` : `/api/admin/portfolio/videos`;
			const method = id ? "PUT" : "POST";
			const res = await fetch(url, {
				method, headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ category, subLabel, format, title, thumbnailPath, linkUrl })
			});
			if (!res.ok) throw new Error("저장 실패");

			alert("처리되었습니다.");
			bootstrap.Modal.getInstance(document.getElementById('videoModal')).hide();
			document.getElementById("videoCategoryFilter").value = category;
			updateVideoSubLabelOptions("videoSubLabelFilter", category);
			document.getElementById("videoSubLabelFilter").value = subLabel;
			loadVideos();
		} catch (err) {
			alert(err.message);
		} finally {
			btn.disabled = false; btn.innerText = "저장하기";
		}
	}

	function openAddVideoModal() {
		document.getElementById("videoForm").reset();
		document.getElementById("videoId").value = "";
		document.getElementById("videoCategory").value = document.getElementById("videoCategoryFilter").value;
		updateVideoSubLabelOptions("videoSubLabel", document.getElementById("videoCategory").value);
		document.getElementById("videoSubLabel").value = document.getElementById("videoSubLabelFilter").value;
		document.getElementById("videoPreview").classList.add("d-none");
		document.getElementById("videoModalTitle").innerText = "영상 등록";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('videoModal')).show();
	}

	function openEditVideoModal(index) {
		const item = videoList[index];
		document.getElementById("videoId").value = item.id;
		document.getElementById("videoCategory").value = item.category;
		updateVideoSubLabelOptions("videoSubLabel", item.category);
		document.getElementById("videoSubLabel").value = item.subLabel;
		document.getElementById("videoTitle").value = item.title;
		document.getElementById("videoLink").value = item.linkUrl || "";

		const preview = document.getElementById("videoPreview");
		const previewImg = document.getElementById("videoPreviewImg");
		if (item.thumbnailPath) { previewImg.src = item.thumbnailPath; preview.classList.remove("d-none"); }
		else { preview.classList.add("d-none"); }

		document.getElementById("videoModalTitle").innerText = "영상 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('videoModal')).show();
	}

	function deleteVideo(id) {
		if (confirm("이 영상을 삭제하시겠습니까?")) {
			fetch(`/api/admin/portfolio/videos/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) { alert("삭제되었습니다."); loadVideos(); } });
		}
	}

	// ===== 공통 =====

	function previewImage(input, previewId, imgId) {
		const previewImg = document.getElementById(imgId);
		if (input.files && input.files[0]) {
			const reader = new FileReader();
			reader.onload = e => {
				previewImg.src = e.target.result;
				document.getElementById(previewId).classList.remove("d-none");
			}
			reader.readAsDataURL(input.files[0]);
		}
	}

	function renderPaginationUI(containerId, totalPages, currentPage, onPageClick) {
		const container = document.getElementById(containerId);
		if (!container) return;
		if (totalPages <= 1) { container.innerHTML = ""; return; }

		let html = "";
		for (let p = 1; p <= totalPages; p++) {
			html += `<li class="page-item ${p === currentPage ? 'active' : ''}">
				<a href="#" class="page-link" data-page="${p}">${p}</a>
			</li>`;
		}
		container.innerHTML = html;

		container.querySelectorAll("a.page-link").forEach((a) => {
			a.addEventListener("click", (e) => {
				e.preventDefault();
				onPageClick(parseInt(a.dataset.page, 10));
			});
		});
	}
</script>
</body>
</html>
