<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상세페이지 제작 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero service-hero--video">
    <video class="service-hero__video" autoplay muted loop playsinline th:src="@{/videos/detail-page-hero.mp4}"></video>
    <div class="service-hero__inner">
      <p class="service-hero__label">D E T A I L   P A G E</p>
      <h1 class="service-hero__title">상세페이지 제작</h1>
      <p class="service-hero__desc">제품 특징부터 임상 결과까지, 제품의 매력이 잘 보이는 상세페이지를 만듭니다.</p>
    </div>
  </section>

  <section class="detail-rows detail-rows--zigzag">
    <div class="detail-rows__inner">
      <div class="detail-row" th:each="section, sectionStat : ${sections}">
        <div class="detail-row__text">
          <span class="detail-row__num" th:text="${#numbers.formatInteger(sectionStat.count, 2)}">01</span>
          <h3 class="detail-row__title" th:text="${section.title}">제목</h3>
          <p class="detail-row__desc" th:text="${section.content}">내용</p>
        </div>
        <div class="detail-row__media">
          <img th:src="@{${section.imagePath}}" th:alt="${section.title}">
        </div>
      </div>
    </div>
  </section>

  <section class="about-cta">
    <div class="about-cta__inner">
      <img th:src="@{/images/logo-icon.png}" alt="H CREATOR" class="about-cta__logo">
      <p class="about-cta__text">잘 팔리는 상세페이지를 경험해보세요</p>
      <div class="about-cta__links">
        <a href="/support" class="about-cta__link">신청하기 →</a>
        <a href="/portfolio" class="about-cta__link about-cta__link--ghost">포트폴리오 →</a>
        <a th:if="${attachment != null}" th:href="@{${attachment.filePath}}" target="_blank"
          class="about-cta__link about-cta__link--ghost" th:text="${attachment.label} + ' →'">기획안 다운로드 →</a>
      </div>
    </div>
  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
