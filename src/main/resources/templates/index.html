<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="hero">
  <video class="hero__video" autoplay muted loop playsinline th:src="@{/videos/main-hero.mp4}"></video>
  <div class="hero__inner">
    <p class="hero__label">CLINICAL TO MARKET</p>
    <h1 class="hero__title">당신의 제품이 더 빛날 수 있도록</h1>
    <p class="hero__desc">임상부터 마케팅, 수출까지 원스톱으로 지원합니다.</p>
    <a href="/portfolio" class="hero__cta">포트폴리오 보기</a>
  </div>
</section>

<section class="services">
  <div class="services__inner">
    <div class="services__item">
      <span class="services__num">01</span>
      <h3 class="services__title">임상시험</h3>
      <p class="services__desc">증명된 데이터로 제품 신뢰도를 높이세요.</p>
      <a href="/clinical" class="services__link">문의하기 →</a>
    </div>
    <div class="services__item">
      <span class="services__num">02</span>
      <h3 class="services__title">마케팅서비스</h3>
      <p class="services__desc">GIF, 상세페이지, 영상까지 한번에.</p>
      <a href="/marketing" class="services__link">신청하기 →</a>
    </div>
    <div class="services__item">
      <span class="services__num">03</span>
      <h3 class="services__title">수출바우처</h3>
      <p class="services__desc">글로벌 진출을 위한 콘텐츠 지원.</p>
      <a href="/voucher" class="services__link">신청하기 →</a>
    </div>
  </div>
</section>

<section class="cta">
  <div class="cta__inner">
    <div class="cta__text">
      <h2 class="cta__title">증명된 데이터를 매출의 기회로 잡으세요.</h2>
      <p class="cta__desc">임상 결과를 콘텐츠와 마케팅으로 연결해, 실제 구매로 이어지는 흐름을 함께 만듭니다.</p>
      <div class="cta__links">
        <a href="/portfolio" class="cta__link cta__link--primary">포트폴리오 보기</a>
        <a href="/support" class="cta__link">문의하기</a>
      </div>
    </div>
    <figure class="cta__media">
      <img th:src="@{/images/logo-vertical.png}" alt="H CREATOR">
    </figure>
  </div>
</section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
