<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H CREATOR</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="192x192" th:href="@{/favicon-192x192.png}">
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="hero" th:with="b=${banners['index']}">
  <video th:if="${b.hasVideo}" class="hero__video" autoplay muted loop playsinline th:src="${b.videoUrl}"></video>
  <div class="hero__inner">
    <p class="hero__label" th:if="${b.hasLabel}" th:text="${b.label}">CLINICAL TO MARKET</p>
    <h1 class="hero__title" th:utext="${b.titleHtml}">제목</h1>
    <p class="hero__desc" th:if="${b.hasDescription}" th:utext="${b.descriptionHtml}">설명</p>
    <a th:if="${b.hasButton}" th:href="@{${b.buttonLink}}" class="hero__cta" th:text="${b.buttonText}">포트폴리오 보기</a>
  </div>
</section>

<section class="services">
  <div class="services__inner">
    <div class="services__item">
      <span class="services__num">01</span>
      <h3 class="services__title">임상시험</h3>
      <p class="services__desc">제품의 가치를 높이는 객관적 검증</p>
      <a href="/clinical" class="services__link">문의하기 →</a>
    </div>
    <div class="services__item">
      <span class="services__num">02</span>
      <h3 class="services__title">마케팅서비스</h3>
      <p class="services__desc">GIF, 상세페이지, 영상까지 한번에.</p>
      <a href="/marketing" class="services__link">신청하기 →</a>
    </div>
    <div class="services__item">
      <span class="services__num">03</span>
      <h3 class="services__title">수출바우처</h3>
      <p class="services__desc">글로벌 진출을 위한 콘텐츠 지원.</p>
      <a href="/voucher" class="services__link">신청하기 →</a>
    </div>
  </div>
</section>

<section class="cta" th:with="b=${banners['index-cta']}">
  <div class="cta__inner">
    <div class="cta__text">
      <h2 class="cta__title" th:utext="${b.titleHtml}">제목</h2>
      <p class="cta__desc" th:if="${b.hasDescription}" th:utext="${b.descriptionHtml}">설명</p>
      <div class="cta__links">
        <a th:if="${b.hasButton}" th:href="@{${b.buttonLink}}" class="cta__link cta__link--primary" th:text="${b.buttonText}">포트폴리오 보기</a>
        <a th:if="${b.hasButton2}" th:href="@{${b.button2Link}}" class="cta__link" th:text="${b.button2Text}">문의하기</a>
      </div>
    </div>
    <figure class="cta__media" th:if="${b.hasImage}">
      <img th:src="${b.imageUrl}" alt="H CREATOR">
    </figure>
  </div>
</section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
