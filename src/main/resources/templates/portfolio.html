<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero">
    <div class="service-hero__inner">
      <p class="service-hero__label">PORTFOLIO</p>
      <h1 class="service-hero__title">포트폴리오</h1>
      <p class="service-hero__desc">AI 이미지, 카드뉴스, 상세페이지, 영상까지 — 휴먼이 만든 콘텐츠를 확인해보세요.</p>
    </div>
  </section>

  <section class="portfolio">
    <div class="portfolio__inner">

      <div class="portfolio__controls">
        <div class="portfolio__tabs">
          <button class="portfolio__tab is-active" data-filter="all">전체</button>
          <button class="portfolio__tab" data-filter="ai-image">AI 이미지 제작</button>
          <button class="portfolio__tab" data-filter="card-news">카드뉴스</button>
          <button class="portfolio__tab" data-filter="detail-page">상세페이지</button>
          <button class="portfolio__tab" data-filter="video">영상</button>
        </div>
        <input type="text" class="portfolio__search" placeholder="제품명으로 검색">
      </div>

      <div class="portfolio__grid">

        <!-- 이미지 항목 (AI 이미지 / 카드뉴스 / 상세페이지) -->
        <a th:each="item : ${portfolioItems}"
           th:href="${item.linkUrl != null and !item.linkUrl.isEmpty()} ? ${item.linkUrl} : '#'"
           class="portfolio__item"
           th:data-category="${item.category}"
           th:data-name="${item.name}">
          <img th:src="@{${item.imagePath}}" th:alt="${item.name}">
          <span class="portfolio__item-label" th:text="${item.name}">이름</span>
        </a>

        <!-- 영상 그룹 대표 카드 (그룹당 첫 번째 영상으로 미리보기) -->
        <a th:if="${not #lists.isEmpty(productIntroVideos)}"
           href="#vg-intro" class="portfolio__item portfolio__item--video"
           data-category="video" th:data-name="${productIntroVideos[0].title}" data-target="vg-intro">
          <span class="portfolio__item-thumb">
            <img th:src="@{${productIntroVideos[0].thumbnailPath}}" th:alt="${productIntroVideos[0].title}">
            <span class="portfolio__item-label" th:text="${productIntroVideos[0].title}">제목</span>
          </span>
          <span class="portfolio__item-group">제품 소개</span>
        </a>

        <a th:if="${not #lists.isEmpty(reviewVideos)}"
           href="#vg-review" class="portfolio__item portfolio__item--video"
           data-category="video" th:data-name="${reviewVideos[0].title}" data-target="vg-review">
          <span class="portfolio__item-thumb">
            <img th:src="@{${reviewVideos[0].thumbnailPath}}" th:alt="${reviewVideos[0].title}">
            <span class="portfolio__item-label" th:text="${reviewVideos[0].title}">제목</span>
          </span>
          <span class="portfolio__item-group">제품 리뷰</span>
        </a>

        <a th:if="${not #lists.isEmpty(shortformVideos)}"
           href="#vg-short" class="portfolio__item portfolio__item--video"
           data-category="video" th:data-name="${shortformVideos[0].title}" data-target="vg-short">
          <span class="portfolio__item-thumb">
            <img th:src="@{${shortformVideos[0].thumbnailPath}}" th:alt="${shortformVideos[0].title}">
            <span class="portfolio__item-label" th:text="${shortformVideos[0].title}">제목</span>
          </span>
          <span class="portfolio__item-group">숏폼 콘텐츠</span>
        </a>

        <a th:if="${not #lists.isEmpty(aiProductionVideos)}"
           href="#vg-ai" class="portfolio__item portfolio__item--video"
           data-category="video" th:data-name="${aiProductionVideos[0].title}" data-target="vg-ai">
          <span class="portfolio__item-thumb">
            <img th:src="@{${aiProductionVideos[0].thumbnailPath}}" th:alt="${aiProductionVideos[0].title}">
            <span class="portfolio__item-label" th:text="${aiProductionVideos[0].title}">제목</span>
          </span>
          <span class="portfolio__item-group">AI 제작</span>
        </a>

      </div>

      <p class="portfolio__empty" hidden>검색 결과가 없습니다.</p>

      <div class="portfolio__video-groups">

        <div class="portfolio__video-group" id="vg-intro">
          <h3 class="portfolio__video-heading">제품 소개</h3>
          <div class="portfolio__video-row portfolio__video-row--wide">
            <a th:each="video : ${productIntroVideos}"
               th:href="${video.linkUrl}" target="_blank" rel="noopener"
               class="portfolio__video-card" th:data-name="${video.title}">
              <div class="portfolio__video-thumb">
                <img th:src="@{${video.thumbnailPath}}" th:alt="${video.title}">
              </div>
              <span class="portfolio__video-title" th:text="${video.title}">제목</span>
            </a>
          </div>
        </div>

        <div class="portfolio__video-group" id="vg-review">
          <h3 class="portfolio__video-heading">제품 리뷰</h3>
          <div class="portfolio__video-row portfolio__video-row--wide">
            <a th:each="video : ${reviewVideos}"
               th:href="${video.linkUrl}" target="_blank" rel="noopener"
               class="portfolio__video-card" th:data-name="${video.title}">
              <div class="portfolio__video-thumb">
                <img th:src="@{${video.thumbnailPath}}" th:alt="${video.title}">
              </div>
              <span class="portfolio__video-title" th:text="${video.title}">제목</span>
            </a>
          </div>
        </div>

        <div class="portfolio__video-group" id="vg-short">
          <h3 class="portfolio__video-heading">숏폼 콘텐츠</h3>
          <div class="portfolio__video-row portfolio__video-row--narrow">
            <a th:each="video : ${shortformVideos}"
               th:href="${video.linkUrl}" target="_blank" rel="noopener"
               class="portfolio__video-card" th:data-name="${video.title}">
              <div class="portfolio__video-thumb">
                <img th:src="@{${video.thumbnailPath}}" th:alt="${video.title}">
              </div>
              <span class="portfolio__video-title" th:text="${video.title}">제목</span>
            </a>
          </div>
        </div>

        <div class="portfolio__video-group" id="vg-ai">
          <h3 class="portfolio__video-heading">AI 제작</h3>
          <div class="portfolio__video-row portfolio__video-row--narrow">
            <a th:each="video : ${aiProductionVideos}"
               th:href="${video.linkUrl}" target="_blank" rel="noopener"
               class="portfolio__video-card" th:data-name="${video.title}">
              <div class="portfolio__video-thumb">
                <img th:src="@{${video.thumbnailPath}}" th:alt="${video.title}">
              </div>
              <span class="portfolio__video-title" th:text="${video.title}">제목</span>
            </a>
          </div>
        </div>

      </div>

    </div>
  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
