<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero">
    <div class="service-hero__inner">
      <p class="service-hero__label">PORTFOLIO</p>
      <h1 class="service-hero__title">포트폴리오</h1>
      <p class="service-hero__desc">AI 이미지, 카드뉴스, 상세페이지, 영상까지 — 휴먼이 만든 콘텐츠를 확인해보세요.</p>
    </div>
  </section>

  <section class="portfolio">
    <div class="portfolio__inner">

      <div class="portfolio__controls">
        <div class="portfolio__tabs">
          <button class="portfolio__tab is-active" data-filter="all">전체</button>
          <button class="portfolio__tab" data-filter="ai-image">AI 이미지 제작</button>
          <button class="portfolio__tab" data-filter="card-news">카드뉴스</button>
          <button class="portfolio__tab" data-filter="detail-page">상세페이지</button>
          <button class="portfolio__tab" data-filter="video">영상</button>
        </div>
        <input type="text" class="portfolio__search" placeholder="제품명으로 검색">
      </div>

      <div class="portfolio__grid">
        <a href="#" class="portfolio__item" data-category="ai-image" data-name="휴먼 리페어 세럼">
            <img th:src="@{/images/portfolio/item-01.jpg}" alt="휴먼 리페어 세럼">
            <span class="portfolio__item-label">휴먼 리페어 세럼</span>
        </a>
        <a href="#" class="portfolio__item" data-category="card-news" data-name="글로우 앰플">
            <img th:src="@{/images/portfolio/item-02.jpg}" alt="글로우 앰플">
            <span class="portfolio__item-label">글로우 앰플</span>
        </a>
        <a href="#" class="portfolio__item" data-category="detail-page" data-name="퓨어 클렌징 오일">
            <img th:src="@{/images/portfolio/item-03.jpg}" alt="퓨어 클렌징 오일">
            <span class="portfolio__item-label">퓨어 클렌징 오일</span>
        </a>
        <a href="#" class="portfolio__item" data-category="ai-image" data-name="모이스처 배리어 밤">
            <img th:src="@{/images/portfolio/item-05.jpg}" alt="모이스처 배리어 밤">
            <span class="portfolio__item-label">모이스처 배리어 밤</span>
        </a>
        <a href="#" class="portfolio__item" data-category="card-news" data-name="비타민 토너">
            <img th:src="@{/images/portfolio/item-06.jpg}" alt="비타민 토너">
            <span class="portfolio__item-label">비타민 토너</span>
        </a>
        <a href="#" class="portfolio__item" data-category="detail-page" data-name="콜라겐 앰플">
            <img th:src="@{/images/portfolio/item-07.jpg}" alt="콜라겐 앰플">
            <span class="portfolio__item-label">콜라겐 앰플</span>
        </a>
        <a href="#vg-intro" class="portfolio__item portfolio__item--video" data-category="video" data-name="리쥬란 제품소개" data-target="vg-intro">
            <span class="portfolio__item-thumb">
              <img th:src="@{/images/portfolio/video-01.jpg}" alt="리쥬란의 모든 것">
              <span class="portfolio__item-label">리쥬란의 모든 것</span>
            </span>
            <span class="portfolio__item-group">제품 소개</span>
        </a>
        <a href="#vg-review" class="portfolio__item portfolio__item--video" data-category="video" data-name="리쥬란 리뷰" data-target="vg-review">
            <span class="portfolio__item-thumb">
              <img th:src="@{/images/portfolio/video-02.jpg}" alt="피부과 전문의 리뷰">
              <span class="portfolio__item-label">피부과 전문의 리뷰</span>
            </span>
            <span class="portfolio__item-group">제품 리뷰</span>
        </a>
        <a href="#vg-short" class="portfolio__item portfolio__item--video" data-category="video" data-name="탈모 숏폼" data-target="vg-short">
            <span class="portfolio__item-thumb">
              <img th:src="@{/images/portfolio/video-03.jpg}" alt="4. 탈모">
              <span class="portfolio__item-label">4. 탈모</span>
            </span>
            <span class="portfolio__item-group">숏폼 콘텐츠</span>
        </a>
        <a href="#vg-ai" class="portfolio__item portfolio__item--video" data-category="video" data-name="AI 제작 예시" data-target="vg-ai">
            <span class="portfolio__item-thumb">
              <img th:src="@{/images/portfolio/video-04.jpg}" alt="AI 제작 콘텐츠">
              <span class="portfolio__item-label">AI 제작 콘텐츠</span>
            </span>
            <span class="portfolio__item-group">AI 제작</span>
        </a>
        </div>

        <p class="portfolio__empty" hidden>검색 결과가 없습니다.</p>

        <div class="portfolio__video-groups">

            <div class="portfolio__video-group" id="vg-intro">
            <h3 class="portfolio__video-heading">제품 소개</h3>
            <div class="portfolio__video-row portfolio__video-row--wide">
                <a href="#" target="_blank" rel="noopener" class="portfolio__video-card" data-name="리쥬란 제품소개">
                <div class="portfolio__video-thumb">
                    <img th:src="@{/images/portfolio/video-01.jpg}" alt="리쥬란 제품소개">
                </div>
                <span class="portfolio__video-title">리쥬란의 모든 것</span>
                </a>
            </div>
            </div>

            <div class="portfolio__video-group" id="vg-review">
            <h3 class="portfolio__video-heading">제품 리뷰</h3>
            <div class="portfolio__video-row portfolio__video-row--wide">
                <a href="#" target="_blank" rel="noopener" class="portfolio__video-card" data-name="리쥬란 리뷰">
                <div class="portfolio__video-thumb">
                    <img th:src="@{/images/portfolio/video-02.jpg}" alt="리쥬란 리뷰">
                </div>
                <span class="portfolio__video-title">피부과 전문의 리뷰</span>
                </a>
            </div>
            </div>

            <div class="portfolio__video-group" id="vg-short">
            <h3 class="portfolio__video-heading">숏폼 콘텐츠</h3>
            <div class="portfolio__video-row portfolio__video-row--narrow">
                <a href="#" target="_blank" rel="noopener" class="portfolio__video-card" data-name="탈모 숏폼">
                <div class="portfolio__video-thumb">
                    <img th:src="@{/images/portfolio/video-03.jpg}" alt="탈모 숏폼">
                </div>
                <span class="portfolio__video-title">4. 탈모</span>
                </a>
            </div>
            </div>

            <div class="portfolio__video-group" id="vg-ai">
            <h3 class="portfolio__video-heading">AI 제작</h3>
            <div class="portfolio__video-row portfolio__video-row--narrow">
                <a href="#" target="_blank" rel="noopener" class="portfolio__video-card" data-name="AI 제작 예시">
                <div class="portfolio__video-thumb">
                    <img th:src="@{/images/portfolio/video-04.jpg}" alt="AI 제작 예시">
                </div>
                <span class="portfolio__video-title">AI 제작 콘텐츠</span>
                </a>
            </div>
            </div>
        </div>

    </div>

  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
