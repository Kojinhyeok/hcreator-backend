<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 지원 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero">
    <div class="service-hero__inner">
      <p class="service-hero__label">SUPPORT</p>
      <h1 class="service-hero__title">서비스 지원</h1>
      <p class="service-hero__desc">필요한 서비스를 선택해 주세요. 남겨주신 신청 및 문의는 확인 후 신속하게 답변드리겠습니다.</p>
    </div>
  </section>

  <section class="support-choice">
    <div class="support-choice__inner">
      <a href="/support/apply" class="support-choice__card">
        <span class="support-choice__title">서비스 신청</span>
        <span class="support-choice__desc">GIF·상세페이지·블로그·영상 제작을 신청합니다.</span>
      </a>
      <a href="/support/inquiry" class="support-choice__card">
        <span class="support-choice__title">서비스 문의</span>
        <span class="support-choice__desc">궁금한 점을 남겨주시면 빠르게 답변드립니다.</span>
      </a>
    </div>
  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
