<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 지원 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero" th:with="b=${banners['support']}" th:classappend="${b.hasVideo} ? 'service-hero--video'">
    <video th:if="${b.hasVideo}" class="service-hero__video" autoplay muted loop playsinline preload="auto" th:src="${b.videoUrl}"></video>
    <div class="service-hero__inner">
      <p class="service-hero__label" th:if="${b.hasLabel}" th:text="${b.label}">LABEL</p>
      <h1 class="service-hero__title" th:utext="${b.titleHtml}">제목</h1>
      <p class="service-hero__desc" th:if="${b.hasDescription}" th:utext="${b.descriptionHtml}">설명</p>
    </div>
  </section>

  <section class="support-choice">
    <div class="support-choice__inner">
      <a href="/support/apply" class="support-choice__card">
        <span class="support-choice__title">서비스 신청</span>
        <span class="support-choice__desc">GIF·상세페이지·블로그·영상 제작을 신청합니다.</span>
      </a>
      <a href="/support/inquiry" class="support-choice__card">
        <span class="support-choice__title">서비스 문의</span>
        <span class="support-choice__desc">궁금한 점을 남겨주시면 빠르게 답변드립니다.</span>
      </a>
    </div>
  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
