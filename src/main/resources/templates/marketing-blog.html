<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 마케팅 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero">
    <div class="service-hero__inner">
      <p class="service-hero__label">B L O G   M A R K E T I N G</p>
      <h1 class="service-hero__title">블로그 마케팅</h1>
      <p class="service-hero__desc">아무것도 없는 블로그에서, 검색되는 브랜드로.<br>제품 분석부터 키워드 선정, 콘텐츠 발행까지 블로그 마케팅의 시작을 함께합니다.</p>
    </div>
  </section>

  <section class="detail-rows detail-rows--zigzag">
    <div class="detail-rows__inner">
      <div class="detail-row" th:each="section, sectionStat : ${sections}">
        <div class="detail-row__text">
          <span class="detail-row__num" th:text="${#numbers.formatInteger(sectionStat.count, 2)}">01</span>
          <h3 class="detail-row__title" th:text="${section.title}">제목</h3>
          <p class="detail-row__desc" th:text="${section.content}">내용</p>
        </div>
        <div class="detail-row__media">
          <img th:src="@{${section.imagePath}}" th:alt="${section.title}">
        </div>
      </div>
    </div>
  </section>

  <section class="about-cta">
    <div class="about-cta__inner">
      <img th:src="@{/images/logo-icon.png}" alt="H CREATOR" class="about-cta__logo">
      <p class="about-cta__text">제품의 첫 노출까지, 휴먼이 시작합니다.</p>
      <div class="about-cta__links">
        <a href="#" class="about-cta__link about-cta__link--ghost">휴먼 공식 블로그 →</a>
        <a href="/support" class="about-cta__link">문의하기 →</a>
      </div>
    </div>
  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
