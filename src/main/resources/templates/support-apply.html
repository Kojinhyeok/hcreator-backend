<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 신청 | H CREATOR</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <section class="service-hero">
    <div class="service-hero__inner">
      <p class="service-hero__label">SERVICE APPLY</p>
      <h1 class="service-hero__title">서비스 신청</h1>
      <p class="service-hero__desc">임상시험 이후의 콘텐츠 제작부터 마케팅까지<br>제품의 성과가 실제 구매로 이어질 수 있도록 함께합니다.</p>
    </div>
  </section>

  <section class="apply-form">
    <div class="apply-form__inner">

      <form class="apply-form__form" id="applyForm">

        <!-- 구분 선택 (하나만 선택) -->
        <div class="apply-form__group">
          <label class="apply-form__label">구분<span class="apply-form__req">*</span></label>
          <div class="apply-form__types">
            <label class="apply-form__type">
              <input type="radio" name="serviceType" value="gif" checked> GIF
            </label>
            <label class="apply-form__type">
              <input type="radio" name="serviceType" value="detail-page"> 상세페이지
            </label>
            <label class="apply-form__type">
              <input type="radio" name="serviceType" value="blog"> 블로그
            </label>
            <label class="apply-form__type">
              <input type="radio" name="serviceType" value="video"> 영상
            </label>
          </div>
        </div>

        <!-- 공통 필드 -->
        <div class="apply-form__row">
          <div class="apply-form__group">
            <label class="apply-form__label" for="companyName">회사명<span class="apply-form__req">*</span></label>
            <input type="text" id="companyName" name="companyName" class="apply-form__input">
          </div>
        </div>
        <div class="apply-form__row apply-form__row--split">
          <div class="apply-form__group">
            <label class="apply-form__label" for="contactName">이름<span class="apply-form__req">*</span></label>
            <input type="text" id="contactName" name="contactName" class="apply-form__input">
          </div>
          <div class="apply-form__group">
            <label class="apply-form__label" for="contactPhone">연락처<span class="apply-form__req">*</span></label>
            <input type="tel" id="contactPhone" name="contactPhone" class="apply-form__input">
          </div>
        </div>
        <div class="apply-form__row">
          <div class="apply-form__group">
            <label class="apply-form__label" for="contactEmail">이메일<span class="apply-form__req">*</span></label>
            <input type="email" id="contactEmail" name="contactEmail" class="apply-form__input">
          </div>
        </div>

        <!-- GIF 전용 필드 -->
        <div class="apply-form__fieldset" data-fieldset="gif">

        <div class="apply-form__group">
            <label class="apply-form__label">신청 목록</label>
            <div class="apply-form__table-wrap">
            <table class="apply-form__table" id="gifRequestTable">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>보고서 번호</th>
                    <th>시험 항목</th>
                    <th>템플릿 번호</th>
                    <th>피험자 번호</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="gifRequestTableBody">
                <tr>
                    <td class="apply-form__table-num">1</td>
                    <td><input type="text" name="reportNo[]" class="apply-form__table-input"></td>
                    <td><input type="text" name="testItem[]" class="apply-form__table-input"></td>
                    <td><input type="text" name="templateNo[]" class="apply-form__table-input"></td>
                    <td><input type="text" name="subjectNo[]" class="apply-form__table-input"></td>
                    <td><button type="button" class="apply-form__table-remove">삭제</button></td>
                </tr>
                </tbody>
            </table>
            </div>
            <button type="button" id="addGifRow" class="apply-form__table-add">+ 행 추가</button>
        </div>

        <div class="apply-form__row apply-form__row--split">
            <div class="apply-form__group">
            <label class="apply-form__label" for="pointColor">포인트컬러</label>
            <input type="text" id="pointColor" name="pointColor" class="apply-form__input" placeholder="예: #534AB7">
            </div>
            <div class="apply-form__group">
            <label class="apply-form__label" for="bgColor">배경색</label>
            <input type="text" id="bgColor" name="bgColor" class="apply-form__input" placeholder="예: #FFFFFF">
            </div>
        </div>

        <div class="apply-form__row">
            <div class="apply-form__group">
            <label class="apply-form__label">배경 효과</label>
            <div class="apply-form__checks">
                <label><input type="radio" name="bgEffect" value="template" checked> 템플릿 배경 그대로 적용</label>
                <label><input type="radio" name="bgEffect" value="solid"> 단색 배경으로 요청</label>
            </div>
            </div>
        </div>

        <div class="apply-form__row">
            <div class="apply-form__group">
            <label class="apply-form__label" for="gifQuantity">용량</label>
            <input type="text" id="gifQuantity" name="gifQuantity" class="apply-form__input">
            </div>
        </div>

        <div class="apply-form__row">
            <div class="apply-form__group">
            <label class="apply-form__label" for="gifFile">첨부파일</label>
            <input type="file" id="gifFile" name="gifFile" class="apply-form__input">
            </div>
        </div>

        </div>
        <!-- 상세페이지 전용 필드 -->
        <div class="apply-form__fieldset" data-fieldset="detail-page">
            <div class="apply-form__row">
                <div class="apply-form__group">
                <label class="apply-form__label" for="productName1">제품명</label>
                <input type="text" id="productName1" name="productName" class="apply-form__input">
                </div>
            </div>
            <div class="apply-form__row">
                <div class="apply-form__group">
                <label class="apply-form__label" for="launchDate">제품 출시 예정일</label>
                <input type="date" id="launchDate" name="launchDate" class="apply-form__input">
                </div>
            </div>
            <div class="apply-form__row apply-form__row--split">
                <div class="apply-form__group">
                <label class="apply-form__label" for="needsShooting">제품 컷 촬영이 필요하신가요?</label>
                <select id="needsShooting" name="needsShooting" class="apply-form__input">
                    <option value="yes">네 (함께 문의)</option>
                    <option value="no">아니오</option>
                </select>
                </div>
                <div class="apply-form__group">
                <label class="apply-form__label" for="hasPlan">기획안이 있으신가요?</label>
                <select id="hasPlan" name="hasPlan" class="apply-form__input">
                    <option value="yes">네</option>
                    <option value="no">아니오 (기획까지 요청)</option>
                </select>
                </div>
            </div>
        </div>

        <!-- 블로그 / 영상 전용 필드 -->
        <div class="apply-form__fieldset" data-fieldset="blog,video">
          <div class="apply-form__row">
            <div class="apply-form__group">
              <label class="apply-form__label" for="brandName">브랜드명</label>
              <input type="text" id="brandName" name="brandName" class="apply-form__input">
            </div>
          </div>
          <div class="apply-form__row">
            <div class="apply-form__group">
              <label class="apply-form__label" for="productName2">제품명</label>
              <input type="text" id="productName2" name="productNameAlt" class="apply-form__input">
            </div>
          </div>
        </div>

        <!-- 블로그 전용 필드 -->
        <div class="apply-form__fieldset" data-fieldset="blog">
          <div class="apply-form__row">
            <div class="apply-form__group">
              <label class="apply-form__label" for="blogFile">첨부 파일</label>
              <input type="file" id="blogFile" name="blogFile" class="apply-form__input">
            </div>
          </div>
          <div class="apply-form__row">
            <div class="apply-form__group">
              <label class="apply-form__label" for="promoContent">홍보 내용</label>
              <textarea id="promoContent" name="promoContent" class="apply-form__textarea"></textarea>
            </div>
          </div>
        </div>

        <!-- 영상 전용 필드 -->
        <div class="apply-form__fieldset" data-fieldset="video">
          <div class="apply-form__row">
            <div class="apply-form__group">
              <label class="apply-form__label">영상 형식 (중복 가능)</label>
              <div class="apply-form__checks">
                <label><input type="checkbox" name="videoFormat" value="long"> 롱폼</label>
                <label><input type="checkbox" name="videoFormat" value="short"> 숏폼</label>
                <label><input type="checkbox" name="videoFormat" value="undecided"> 미정</label>
              </div>
            </div>
          </div>
          <div class="apply-form__row">
            <div class="apply-form__group">
              <label class="apply-form__label">영상 내용 (중복 가능)</label>
              <div class="apply-form__checks">
                <label><input type="checkbox" name="videoContent" value="brand"> 브랜드 홍보</label>
                <label><input type="checkbox" name="videoContent" value="product"> 제품 홍보</label>
                <label><input type="checkbox" name="videoContent" value="short"> 숏폼</label>
                <label><input type="checkbox" name="videoContent" value="ad"> 광고영상</label>
                <label><input type="checkbox" name="videoContent" value="ai"> AI 영상</label>
                <label><input type="checkbox" name="videoContent" value="etc"> 기타</label>
              </div>
            </div>
          </div>
        </div>

        <!-- 기타사항: GIF / 상세페이지 / 블로그 공통 -->
        <div class="apply-form__row" data-fieldset="gif,detail-page,blog">
          <div class="apply-form__group">
            <label class="apply-form__label" for="etc1">기타사항</label>
            <textarea id="etc1" name="etcNote" class="apply-form__textarea"></textarea>
          </div>
        </div>

        <!-- 요청사항: 영상 전용 -->
        <div class="apply-form__row" data-fieldset="video">
          <div class="apply-form__group">
            <label class="apply-form__label" for="etc2">요청사항</label>
            <textarea id="etc2" name="requestNote" class="apply-form__textarea"></textarea>
          </div>
        </div>

        <div class="apply-form__group apply-form__group--consent">
          <label class="apply-form__consent">
            <input type="checkbox" id="applyConsent" name="privacyConsent" required>
            개인정보 수집 및 이용에 동의합니다.<span class="apply-form__req">*</span>
            <a href="/privacy" target="_blank" class="apply-form__consent-link">[개인정보처리방침]</a>
          </label>
        </div>

        <button type="submit" class="apply-form__submit">신청하기</button>
        <p id="applyResultMsg" class="apply-form__result" style="display:none;"></p>
      </form>

    </div>
  </section>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
</body>
</html>
